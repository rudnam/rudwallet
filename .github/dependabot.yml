# Monthly update PRs, grouped so each ecosystem is one PR. Each runs CI like
# any other PR; merging it deploys.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: npm
    directories:
      - "/web"
      - "/e2e"
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]

  # The images in docker-compose.yml (PostgreSQL) and e2e/compose.yml (the
  # golangci-lint that verify.sh runs), which the docker entry above, reading
  # only the Dockerfile, doesn't see.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /e2e
    schedule:
      interval: monthly
    # A new PostgreSQL major can't open the last one's data directory: production's
    # database wouldn't start. Upgrading takes pg_upgrade or a dump and restore, by hand.
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      docker-compose:
        patterns: ["*"]

  # The Android app's libraries and plugins (android/gradle/libs.versions.toml).
  # These ship in the app, so the pull request comes labelled android-release:
  # merging it releases a new APK (AGENTS.md, "Rules").
  - package-ecosystem: gradle
    directory: /android
    labels: [dependencies, android-release]
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
