# On every push and pull request: run ./verify.sh and keep the browser tests'
# screenshots as an artifact, so you can see what a change looks like without
# running it. On main, also build the image and deploy it to AWS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./verify.sh
      - name: Upload screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e/test-results/
          if-no-files-found: ignore

  # Build the image, push it to ECR, and have the AWS instance run it.
  # Signs in as the github-deploy IAM user (secrets AWS_ACCESS_KEY_ID and
  # AWS_SECRET_ACCESS_KEY), which can do nothing but assume the deploy role
  # for an hour. The role, and everything it can touch, is defined in
  # rudnam/rudnam-infra; the repo variables AWS_DEPLOY_ROLE_ARN and
  # DEPLOY_BUCKET come from its outputs.
  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits rather than cancelling one
    # that's halfway through.
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      APP: wallet-app
      AWS_REGION: ap-southeast-2
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-duration-seconds: 3600
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: VERSION=${{ github.sha }}
          tags: ${{ steps.ecr.outputs.registry }}/${{ env.APP }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The instance runs exactly the Compose files of this commit.
      - name: Upload Compose files
        run: |
          dest="s3://${{ vars.DEPLOY_BUCKET }}/apps/$APP/$GITHUB_SHA"
          aws s3 cp docker-compose.yml "$dest/docker-compose.yml"
          aws s3 cp deploy/aws.yml "$dest/deploy/aws.yml"

      - name: Deploy on the instance
        run: |
          id=$(aws ssm send-command \
            --document-name rudnam-deploy \
            --targets Key=tag:Role,Values=apps \
            --parameters "App=$APP,Sha=$GITHUB_SHA" \
            --comment "$APP ${GITHUB_SHA::7} (run $GITHUB_RUN_ID)" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          while :; do
            sleep 10
            status=$(aws ssm list-command-invocations --command-id "$id" \
              --query 'CommandInvocations[0].Status' --output text)
            case $status in Pending|InProgress|Delayed|None) continue ;; esac
            break
          done
          aws ssm list-command-invocations --command-id "$id" --details \
            --query 'CommandInvocations[0].CommandPlugins[0].Output' --output text
          echo "status: $status"
          [ "$status" = Success ]
