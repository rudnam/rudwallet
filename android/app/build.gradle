apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'io.github.takahirom.roborazzi'

android {
    namespace = "com.rudnam.wallet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.rudnam.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Every release needs a higher versionCode: the app offers a build with a
        // higher one as an update. build.sh sets it from version.sh (one above the
        // published APK); the number here is the floor. 1 and 2 were the Bubblewrap
        // (TWA) app; 4 is the first that checks for updates.
        versionCode((System.getenv('WALLET_VERSION_CODE') ?: '4') as int)
        versionName System.getenv('WALLET_VERSION_NAME') ?: "2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release builds are signed with android.keystore (git-ignored, see README.md);
    // build.sh passes its passwords in from signing-key.txt.
    signingConfigs {
        release {
            storeFile rootProject.file('android.keystore')
            keyAlias 'android'
            storePassword System.getenv('WALLET_KEYSTORE_PASSWORD')
            keyPassword System.getenv('WALLET_KEY_PASSWORD')
        }
    }
    buildFeatures {
        compose = true
    }
    testOptions {
        // Robolectric draws the screens on the JVM, for the screenshot tests.
        unitTests.includeAndroidResources = true
    }
    buildTypes {
        release {
            signingConfig System.getenv('WALLET_KEYSTORE_PASSWORD') ? signingConfigs.release : null
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // The native screens.
    implementation platform("androidx.compose:compose-bom:$composeBomVersion")
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.activity:activity-compose:$activityComposeVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesVersion"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"
    testImplementation platform("androidx.compose:compose-bom:$composeBomVersion")
    testImplementation "androidx.compose.ui:ui-test-junit4"
    testImplementation "org.robolectric:robolectric:$robolectricVersion"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:$roborazzi_version"
    testImplementation "io.github.takahirom.roborazzi:roborazzi-compose:$roborazzi_version"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
