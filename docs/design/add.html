<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"><style>
body{background:#060708}
.dim{position:absolute;inset:0;background:#0C0D0F;opacity:.5}
.sheet{position:absolute;left:0;right:0;bottom:0;top:58px;background:#141518;border-radius:22px 22px 0 0;border-top:1px solid #23252A;display:flex;flex-direction:column}
.grab{width:36px;height:4px;border-radius:2px;background:#33363C;margin:8px auto 0}
.hd{display:flex;justify-content:space-between;align-items:center;padding:10px 20px 0}
.hd b{font-size:17px;font-weight:600}
.x{width:32px;height:32px;border-radius:50%;background:rgb(255 255 255/.06);display:grid;place-items:center;color:var(--muted)}
.seg{margin:14px 20px 0;display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:12px;background:rgb(255 255 255/.05);font-size:14px;text-align:center;color:var(--muted)}
.seg span{padding:8px 0;border-radius:9px}
.seg .on{background:#2A2C31;color:var(--text);font-weight:500;box-shadow:0 1px 0 rgb(255 255 255/.06) inset}
.amount{text-align:center;padding:22px 0 16px;font-size:54px;font-weight:600;letter-spacing:-0.04em;display:flex;justify-content:center;align-items:center;gap:2px}
.amount small{font-size:30px;color:var(--muted);font-weight:500;margin-right:4px}
.caret{width:2.5px;height:46px;background:var(--text);border-radius:2px;margin-left:4px}
.cats{display:flex;gap:6px;padding:0 20px 14px;overflow:hidden}
.cat{flex:none;width:66px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.cat i{width:50px;height:50px;border-radius:15px;background:rgb(255 255 255/.05);border:1px solid #26282D;display:grid;place-items:center;color:var(--soft);font-style:normal}
.cat.on i{background:#EEEFF1;color:#0A0B0D;border-color:#EEEFF1}
.cat.on{color:var(--text);font-weight:500}
.det{margin:0 20px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.d{display:flex;justify-content:space-between;align-items:center;min-height:46px;padding:0 14px;font-size:15px}
.d + .d{border-top:1px solid var(--line)}
.d span:first-child{color:var(--muted)}
.recent{display:flex;gap:6px;padding:0 14px 10px;margin-top:-4px}
.recent span{height:28px;padding:0 10px;border-radius:999px;background:rgb(255 255 255/.06);display:flex;align-items:center;font-size:13px;color:var(--soft)}
.pad{margin-top:auto;padding:8px 6px 26px;background:#0E0F11;border-top:1px solid #1E2025;display:grid;grid-template-columns:repeat(3,1fr) 1.15fr;gap:6px}
.k{height:50px;border-radius:12px;background:#202226;display:grid;place-items:center;font-size:24px;font-weight:400;color:var(--text);box-shadow:inset 0 1px 0 rgb(255 255 255/.05)}
.k.fn{background:transparent;box-shadow:none;color:var(--muted)}
.k.save{grid-row:span 3;height:auto;background:#EEEFF1;color:#0A0B0D;font-size:17px;font-weight:600}
</style></head><body>
<div class="dim"></div>
<div class="sheet">
  <div class="grab"></div>
  <div class="hd"><b>New record</b><span class="x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></span></div>
  <div class="seg"><span class="on">Expense</span><span>Income</span><span>Transfer</span></div>
  <div class="amount num"><small>¥</small>1,480<span class="caret"></span></div>
  <div class="cats">
    <span class="cat on"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0zM8 4c0 2 2 2 2 4M13 4c0 2 2 2 2 4"/></svg></i>Food</span>
    <span class="cat"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 11h-11zM9 8V6a3 3 0 0 1 6 0v2"/></svg></i>Groceries</span>
    <span class="cat"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3.5" width="12" height="14" rx="3"/><path d="M6 11h12M9 21l1.5-3.5M15 21l-1.5-3.5"/></svg></i>Transport</span>
    <span class="cat"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7zM9 7a3 3 0 0 1 6 0"/></svg></i>Shopping</span>
    <span class="cat"><i><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg></i>All</span>
  </div>
  <div class="det">
    <div class="d"><span>Payee</span><span style="color:var(--muted)">Shop or person</span></div>
    <div class="recent"><span>コメダ珈琲店</span><span>セブン-イレブン</span><span>すき家</span></div>
    <div class="d"><span>Account</span><span>Cash</span></div>
    <div class="d"><span>When</span><span>Today, 12:40</span></div>
  </div>
  <div class="pad num">
    <span class="k">1</span><span class="k">2</span><span class="k">3</span><span class="k fn"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1zM12 9l6 6M18 9l-6 6"/></svg></span>
    <span class="k">4</span><span class="k">5</span><span class="k">6</span><span class="k save">Save</span>
    <span class="k">7</span><span class="k">8</span><span class="k">9</span>
    <span class="k" style="grid-column:span 2">0</span><span class="k" style="font-size:19px">000</span>
  </div>
</div>
</body></html>
