# Throwaway stack for ./verify.sh and ./preview.sh. Always run it through
# those scripts: they give it its own Compose project (<folder>-verify or
# <folder>-preview), so it never touches the live stack, and the database
# lives in tmpfs, so nothing persists.

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: verify
      POSTGRES_DB: app
    volumes:
      # Also creates app_test, which the Go integration tests wipe freely.
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 1s
      timeout: 3s
      retries: 30

  # The app built exactly as production builds it, from the working tree or
  # (with preview.sh --ref) from a git ref.
  # Not named "app": Chrome forces HTTPS for that hostname (.app is HSTS-preloaded).
  server:
    build:
      context: ${BUILD_CONTEXT:-..}
      args:
        VERSION: ${APP_VERSION:-verify}
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
    environment:
      DATABASE_URL: postgres://app:verify@db:5432/app?sslmode=disable
      COOKIE_SECURE: "false"
      # Every browser test signs up its own user, all from this one IP.
      AUTH_RATE_LIMIT: "1000"
      LOG_LEVEL: debug
      # Email automation on, so forwarding addresses show and the tests (and
      # preview.sh) can deliver mail to the webhook like the provider would.
      INBOUND_DOMAIN: in.example.test
      INBOUND_SECRET: e2e-inbound-secret-0123456789
      # Links in emails point here; preview.yml changes it to localhost.
      PUBLIC_ORIGIN: http://server:8080
      # The Android app's package, which Google sign-in in the app returns to.
      ANDROID_PACKAGE: com.rudnam.wallet
      ANDROID_CERT_FINGERPRINTS: "00:11:22:33"
      # Sign in with Google shows, with a client Google doesn't know: the
      # tests stop at the redirect (the Go tests cover the rest).
      GOOGLE_CLIENT_ID: e2e-client.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: e2e-client-secret
      # Claude features go to the fake Claude below (preview.yml uses the real one).
      ANTHROPIC_BASE_URL: http://claude:8090
      # Encrypts users' saved API keys.
      SECRETS_KEY: e2e-secrets-key-0123456789abcdefghij
      # Confirmation emails go to the mail catcher below.
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      MAIL_FROM: Wallet <no-reply@example.test>
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Catches the app's outgoing email. Tests read it through its API;
  # preview.sh shows its inbox at http://localhost:8025.
  mail:
    image: axllent/mailpit:v1.27

  # go vet plus every Go test, including the HTTP integration tests.
  gotest:
    image: golang:1.26-alpine
    profiles: [go]
    working_dir: /src
    depends_on:
      db:
        condition: service_healthy
    environment:
      CGO_ENABLED: "0"
      TEST_DATABASE_URL: postgres://app:verify@db:5432/app_test?sslmode=disable
    volumes:
      - ..:/src:ro
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    command: ["sh", "-c", "go vet ./... && go test -p 1 -count=1 ./..."]

  # A fake Anthropic API for the browser tests (fake-claude.js).
  claude:
    image: mcr.microsoft.com/playwright:v${PW_VERSION:?run through verify.sh}-noble
    profiles: [e2e]
    working_dir: /e2e
    volumes:
      - .:/e2e:ro
    command: ["node", "fake-claude.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8090/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 1s
      timeout: 3s
      retries: 30

  # Playwright browser tests against the app. The image tag comes from
  # @playwright/test's version in package.json (see verify.sh).
  e2e:
    image: mcr.microsoft.com/playwright:v${PW_VERSION:?run through verify.sh}-noble
    profiles: [e2e]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    working_dir: /e2e
    depends_on:
      server:
        condition: service_healthy
      claude:
        condition: service_healthy
    environment:
      HOME: /tmp
      BASE_URL: http://server:8080
      MAIL_API: http://mail:8025
    volumes:
      - .:/e2e

volumes:
  gomod:
  gobuild:
