# Added on top of compose.yml by ./preview.sh: publishes the app on this machine.
services:
  server:
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8081}:8080"
    environment:
      PUBLIC_ORIGIN: http://localhost:${PREVIEW_PORT:-8081}
  # The inbox of every email the preview sends, e.g. confirmation links.
  mail:
    ports:
      - "127.0.0.1:${PREVIEW_MAIL_PORT:-8025}:8025"
