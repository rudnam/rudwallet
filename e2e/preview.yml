# Added on top of compose.yml by ./preview.sh: publishes the app on this machine.
services:
  server:
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8081}:8080"
    environment:
      PUBLIC_ORIGIN: http://localhost:${PREVIEW_PORT:-8081}
      # The real Claude, so you can try your own API key in the preview.
      ANTHROPIC_BASE_URL: https://api.anthropic.com
  # The inbox of every email the preview sends, e.g. confirmation links.
  mail:
    ports:
      - "127.0.0.1:${PREVIEW_MAIL_PORT:-8025}:8025"
  # Fills the preview account with months of sample records (e2e/seed).
  seed:
    image: ${GO_IMAGE:?run through preview.sh}
    profiles: [seed]
    working_dir: /src
    depends_on:
      server:
        condition: service_healthy
    environment:
      CGO_ENABLED: "0"
      TZ: ${PREVIEW_TZ:-UTC}
    volumes:
      - ..:/src:ro
      - gomod:/go/pkg/mod
      - gobuild:/root/.cache/go-build
    command: ["go", "run", "./e2e/seed", "-url", "http://server:8080"]
